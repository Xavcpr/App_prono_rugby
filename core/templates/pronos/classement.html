<h1>Classement par compétition</h1>

<form method="get" class="mb-3">
  <select name="competition" class="form-select" onchange="this.form.submit()">
    <option value="">-- Choisir une compétition --</option>
    {% for competition in competitions %}
    <option
      value="{{ competition.id }}"
      {%
      if
      selected_competition
      and
      competition.id=""
      ="selected_competition.id"
      %}
      selected
      {%
      endif
      %}
    >
      {{ competition.name }}
    </option>
    {% endfor %}
  </select>
</form>

{% if selected_competition %}
<h2>{{ selected_competition.name }}</h2>

{% if rankings %}
<!-- affichage du classement -->
{% else %}
<p>Aucun classement enregistré.</p>
{% endif %} {% endif %}

<a href="{% url 'pronos' %}" class="btn btn-secondary mt-3">
  ← Retour aux pronos
</a>
