<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Pronostics Rugby</title>
  </head>
  <body>
    <h1>Pronostics Rugby</h1>
    <form method="post">
      {% csrf_token %}
      <table border="1">
        <tr>
          <th>Match</th>
          <th>Bonus off. domicile</th>
          <th>Score domicile</th>
          <th>Score extérieur</th>
          <th>Bonus off. extérieur</th>
        </tr>

        {% for match in matches %}
        <tr>
          <td>{{ match.home_team.name }} - {{ match.away_team.name }}</td>

          <td style="text-align: center">
            <input type="checkbox" name="bonus_home_{{ match.id }}" />
          </td>

          <td>
            <input type="number" name="home_{{ match.id }}" min="0" required />
          </td>

          <td>
            <input type="number" name="away_{{ match.id }}" min="0" required />
          </td>

          <td style="text-align: center">
            <input type="checkbox" name="bonus_away_{{ match.id }}" />
          </td>
        </tr>
        {% endfor %}
      </table>

      <button type="submit">Envoyer mes pronostics</button>
    </form>
    {% if user.is_authenticated %}
    <p>
      Bonjour {{ user.username }} !
      <a href="{% url 'logout' %}?next=/">Se déconnecter</a>
    </p>
    {% endif %}
  </body>
</html>
