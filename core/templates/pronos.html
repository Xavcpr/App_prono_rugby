{% for match in matches %}
<tr>
  <td>
    {{ match.home_team }} – {{ match.away_team }} {% if match.is_locked %}
    <span class="badge bg-secondary ms-2">Match commencé</span>
    {% endif %}
  </td>

  <td>{{ match.kickoff_at|date:"d/m/Y H:i" }}</td>

  <td>
    <input
      type="checkbox"
      name="bonus_home_{{ match.id }}"
      class="form-check-input"
      {%
      if
      match.user_prediction
      and
      match.user_prediction.bonus_home_pred
      %}checked{%
      endif
      %}
      {%
      if
      match.is_locked
      %}disabled{%
      endif
      %}
    />
  </td>

  <td class="d-flex gap-1">
    <input
      type="number"
      name="home_score_{{ match.id }}"
      value="{{ match.user_prediction.home_score_pred|default:'' }}"
      class="form-control form-control-sm"
      style="width: 60px"
      {%
      if
      match.is_locked
      %}disabled{%
      endif
      %}
    />

    <input
      type="number"
      name="away_score_{{ match.id }}"
      value="{{ match.user_prediction.away_score_pred|default:'' }}"
      class="form-control form-control-sm"
      style="width: 60px"
      {%
      if
      match.is_locked
      %}disabled{%
      endif
      %}
    />
  </td>

  <td>
    <input
      type="checkbox"
      name="bonus_away_{{ match.id }}"
      class="form-check-input"
      {%
      if
      match.user_prediction
      and
      match.user_prediction.bonus_away_pred
      %}checked{%
      endif
      %}
      {%
      if
      match.is_locked
      %}disabled{%
      endif
      %}
    />
  </td>

  {% if not match.is_locked %}
  <input type="hidden" name="match_ids" value="{{ match.id }}" />
  {% endif %}
</tr>
{% endfor %}
