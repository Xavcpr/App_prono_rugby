{% extends "base.html" %}
{% block content %}
    <div class="container mt-4">
        <div class="text-center mb-4">
            <h2>Bonjour, {{ player.name }} ! 👋</h2>
            <p class="text-muted">Ravi de te revoir pour la suite de la compétition.</p>
        </div>
        <div class="row g-3">
            <div class="col-6 col-md-4">
                <div class="card text-center border-primary shadow-sm h-100">
                    <div class="card-body">
                        <h6 class="text-uppercase small text-muted">Général</h6>
                        <div class="h2 fw-bold text-primary">{{ rank }}e</div>
                        <small>sur {{ total_players }}</small>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-4">
                <div class="card text-center border-success shadow-sm h-100">
                    <div class="card-body">
                        <h6 class="text-uppercase small text-muted">Tout-Pile</h6>
                        <div class="h2 fw-bold text-success">🎯 {{ perfect_scores }}</div>
                    </div>
                </div>
            </div>
            <div class="col-12 mt-4">
                <a href="{% url 'pronos' %}"
                   class="btn btn-primary btn-lg w-100 py-3 shadow">🏉 PRONOSTIQUER LES MATCHS</a>
            </div>
        </div>
    </div>
{% endblock %}
